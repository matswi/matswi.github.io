<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>closed...</title>
  <style>
    :root {
      --bg: #f2f0ec;
      --ink: #2b2a28;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b1a;
        --ink: #e6e2da;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    .sign {
      margin: 0;
      font-family: "Courier New", Courier, ui-monospace, monospace;
      font-size: clamp(8px, 2.6vw, 20px);
      line-height: 1.15;
      white-space: pre;
      overflow-x: auto;
      max-width: 100%;
    }
  </style>
</head>
<body>
<pre class="sign" role="img" aria-label="closed...">
      _                    _          
  ___| | ___  ___  ___  __| |         
 / __| |/ _ \/ __|/ _ \/ _` |         
| (__| | (_) \__ \  __/ (_| |  _  _  _ 
 \___|_|\___/|___/\___|\__,_| (_)(_)(_)
</pre>
</body>
</html>
